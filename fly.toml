# fly.toml app configuration file generated for unicorn-mining-co on 2026-09-26T16:27:13+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'unicorn-mining-co'
primary_region = 'lhr'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]
[env]
NODE_ENV = 'production'
PORT = '8080'
WORLD_SEED = '25'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = '30s'
timeout = '5s'
grace_period = '10s'
method = 'GET'
path = '/healthz'

[[vm]]
# Shared CPU quota is pooled: two vCPUs provide a 12.5% sustained allowance;
# four vCPUs provide 25% if this tier proves insufficient after deployment.
# The heaviest post-fix local test needed ~13% before network overhead.
memory = '512mb'
cpu_kind = 'shared'
cpus = 2
memory_mb = 512
