# fly.toml app configuration file generated for unicorn-mining-co on 2026-09-26T16:27:13+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'unicorn-mining-co'
primary_region = 'lhr'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]
[deploy]
strategy = 'immediate'

[env]
APP_ENV = 'production'
PORT = '8080'
WORLD_SEED = '25'
DATABASE_PATH = '/data/world.sqlite'
BACKUP_DIRECTORY = '/data/backups'
# Budget Go-managed memory below VM RAM, leaving room for the OS and file mappings.
GOMEMLIMIT = '300MiB'

[[mounts]]
source = 'game_data'
destination = '/data'
initial_size = '1gb'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = '30s'
timeout = '5s'
grace_period = '10s'
method = 'GET'
path = '/healthz'

[[vm]]
# Shared quota is pooled: two vCPUs provide 0.125 CPU in total,
# or 6.25% average utilization across the machine's two vCPUs.
memory = '512mb'
cpu_kind = 'shared'
cpus = 2
memory_mb = 512
