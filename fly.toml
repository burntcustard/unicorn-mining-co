# fly.toml app configuration file generated for unicorn-mining-co on 2026-09-26T16:27:13+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'unicorn-mining-co'
primary_region = 'lhr'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]
[deploy]
strategy = 'immediate'

[env]
APP_ENV = 'production'
PORT = '8080'
WORLD_SEED = '25'
DATABASE_PATH = '/data/world.sqlite'
BACKUP_DIRECTORY = '/data/backups'
# Collect sooner on the 512 MiB Machine; long 32-player captures at GOGC=800
# exceed its RAM even before SQLite and the OS are included.
GOGC = '200'

[[mounts]]
source = 'game_data'
destination = '/data'
initial_size = '1gb'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = '30s'
timeout = '5s'
grace_period = '10s'
method = 'GET'
path = '/healthz'

[[vm]]
# Shared CPU quota is pooled: two vCPUs provide a 12.5% sustained allowance;
# four vCPUs provide 25% if this tier proves insufficient after deployment.
# Measurements: docs/experiments/performance-investigation-2026-09-26-three-player.md
memory = '512mb'
cpu_kind = 'shared'
cpus = 2
memory_mb = 512
