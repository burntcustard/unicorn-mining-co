name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Set up Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src/server
          cache-bin: false
          key: ubuntu-26.04-static-gnu

      - name: Install dependencies
        run: npm ci
      - name: Lint JavaScript, TypeScript, and CSS
        run: |
          npm run lint:js
          npm run lint:css
      - name: Build production assets and server
        env:
          SERVER_BUILD_TARGET: x86_64-unknown-linux-gnu
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          npm run build
          readelf -l bin/server > "$RUNNER_TEMP/server-elf.txt"
          ! grep -q INTERP "$RUNNER_TEMP/server-elf.txt"
          sha256sum bin/server dist/* > "$RUNNER_TEMP/deploy-artifacts.sha256"
      - name: Test production build
        run: |
          npm test -- --skip-build
          # Run the Rust checks without compiling another server executable.
          cargo test --locked --manifest-path src/server/Cargo.toml \
            --no-default-features --features test-fixtures --lib --test world -- --include-ignored
      # Clippy can reuse dependency artifacts compiled for the fixtures and tests.
      - name: Lint Rust
        run: npm run lint:rust
      - name: Verify tested artifacts
        run: sha256sum --check "$RUNNER_TEMP/deploy-artifacts.sha256"

      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy tested artifacts to Fly
        run: flyctl deploy --ha=false --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
