    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #101018;
      color: #eef;
      font:
        14px/1.5 system-ui,
        sans-serif;
    }
    main {
      padding: 28px;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 4px;
      font-weight: 600;
    }
    header p {
      margin: 0;
      color: #a9a6bd;
    }
    .badge {
      border: 1px solid #eeeeff33;
      padding: 6px 12px;
      color: #c1b8d4;
      font-size: 12px;
    }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .option h2 {
      font-size: 17px;
      margin: 0 0 10px;
      font-weight: 600;
    }
    .option p {
      color: #b0aabf;
      margin: 10px 0 0;
      min-height: 42px;
      font-size: 13px;
      max-width: 480px;
    }
    .scene {
      height: 240px;
      position: relative;
      overflow: hidden;
      border: 1px solid #eeeeff26;
      background:
        radial-gradient(ellipse at 80% 80%, #35205b, transparent 65%),
        radial-gradient(ellipse at 10% 0%, #162c52, transparent 70%), #130b24;
    }
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 12% 15%, #fff 0 0.7px, transparent 1px),
        radial-gradient(circle at 65% 19%, #4df 0 0.6px, transparent 1px),
        radial-gradient(circle at 85% 50%, #fff 0 0.7px, transparent 1px),
        radial-gradient(circle at 31% 72%, #eef 0 0.5px, transparent 1px);
      background-size:
        170px 130px,
        220px 180px,
        240px 170px,
        130px 140px;
      opacity: 0.5;
    }
    .panel {
      position: absolute;
      bottom: 16px;
      left: 16px;
      width: 390px;
      padding: 16px 32px 16px 16px;
      font:
        12px/1.5 Gemetric,
        sans-serif;
      display: grid;
      gap: 12px;
    }
    .panel:before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgb(from #223 r g b / 0.8);
      backdrop-filter: blur(4px);
      clip-path: polygon(
        0 0,
        calc(100% - 100px) 0,
        100% 58px,
        100% 100%,
        0 100%
      );
    }
    .panel:after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgb(from #eef r g b / 0.3);
      clip-path: polygon(
        evenodd,
        0 0,
        calc(100% - 100px) 0,
        100% 58px,
        100% 100%,
        0 100%,
        0 0,
        2px 2px,
        2px calc(100% - 2px),
        calc(100% - 2px) calc(100% - 2px),
        calc(100% - 2px) 59.15px,
        calc(100% - 100.54px) 2px,
        2px 2px
      );
      pointer-events: none;
    }
    .panel > * {
      position: relative;
      z-index: 1;
    }
    .cargo {
      width: 270px;
      min-height: 62px;
      display: grid;
      align-content: center;
      gap: 8px;
    }
    .cargo-heading {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cargo-heading > svg,
    .fuel > svg,
    .power > svg,
    .dial-caption > svg {
      width: 18px;
      height: 20px;
      flex: none;
    }
    .count {
      display: flex;
      gap: 6px;
      align-items: baseline;
    }
    .count strong {
      font-size: 24px;
      font-weight: 400;
      line-height: 1.2;
    }
    .count span {
      font-size: 12px;
      color: #ddd;
    }
    .aside {
      margin-left: auto;
      font-size: 12px;
      color: #aaa9bd;
    }
    .slot-rack {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      width: 192px;
      margin-left: 28px;
    }
    .slot-rack i {
      height: 12px;
      border: 1px solid #eeeeff66;
      background: #eeeeff0a;
    }
    .slot-rack i.used {
      background: #4df;
      border-color: #4df;
    }
    .capacity-bar {
      margin-left: 28px;
      width: 220px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 2px;
    }
    .capacity-bar i {
      height: 10px;
      background: #eeeeff26;
    }
    .capacity-bar i.used {
      background: #4df;
    }
    .crate-layout {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .crates {
      display: grid;
      grid-template-columns: repeat(4, 25px);
      gap: 0 3px;
    }
    .crates span {
      width: 25px;
      height: 26px;
      color: #eeeeff40;
    }
    .crates svg {
      width: 25px;
      height: 26px;
    }
    .crates .used {
      color: #4df;
    }
    .crates .used svg {
      fill: #44ddff26;
    }
    .micro {
      display: block;
      color: #aaa9bd;
      font-size: 12px;
      margin-top: 8px;
    }
    .dial-layout {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .dial {
      position: relative;
      width: 90px;
      height: 90px;
    }
    .ring {
      width: 90px;
      height: 90px;
      display: block;
    }
    .dial-count {
      position: absolute;
      inset: 20px 0;
      display: grid;
      justify-items: center;
      align-content: center;
      line-height: 1.35;
    }
    .dial-count strong {
      font-size: 24px;
      font-weight: 400;
    }
    .dial-count small {
      font-size: 12px;
      color: #ddd;
    }
    .dial-caption {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .dial-caption small {
      font-size: 12px;
      color: #aaa9bd;
      display: inline-block;
      margin-top: 6px;
    }
    .free-number {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: #4df;
    }
    .free-number strong {
      font-size: 24px;
      font-weight: 400;
    }
    .free-number span {
      font-size: 12px;
    }
    .used-count {
      margin-left: auto;
      font-size: 16px;
    }
    .used-count small {
      display: block;
      color: #aaa9bd;
      font-size: 12px;
    }
    .free-space {
      display: flex;
      height: 12px;
      width: 220px;
      margin-left: 28px;
      gap: 3px;
    }
    .occupied {
      width: 58.333%;
      background: #eeeeff40;
    }
    .available {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
    }
    .available i {
      background: #44ddff26;
      border: 1px solid #4df;
    }
    .fuel,
    .power {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 20px;
    }
    .fuel-segments {
      display: flex;
      gap: 2px;
      width: 120px;
      height: 8px;
    }
    .fuel-segments i {
      flex: 1;
      background: #4df;
    }
    .fuel-segments i:first-child {
      background: #c00;
    }
    .fuel-segments i:nth-last-child(-n + 2) {
      background: #eeeeff26;
    }
    .fuel small {
      font-size: 12px;
    }
    .power-bar {
      width: 192px;
      height: 12px;
      background: linear-gradient(90deg, #fd4 0 66%, #eeeeff26 66%);
    }
    .net {
      font-size: 20px;
      color: #fd4;
      margin-left: 5px;
      white-space: nowrap;
    }
    .net small {
      font-size: 12px;
    }
    .single main {
      padding: 24px;
    }
    .single .options {
      display: block;
    }
    .single header {
      display: none;
    }
    .single .scene {
      height: 255px;
    }
    .single .option p {
      max-width: 460px;
    }
  </style>
