[package]
name = "unicorn-mining-server"
version = "0.1.0"
edition = "2024"
publish = false
autoexamples = false
autotests = false

[lib]
path = "lib.rs"

[[bin]]
name = "unicorn-mining-server"
path = "main.rs"
required-features = ["server-bin"]

[[test]]
name = "world"
path = "../../tests/server/world.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[features]
default = ["server-bin"]
server-bin = []
test-fixtures = []
benchmark-fixtures = []

[[example]]
name = "trade_fixture"
path = "../../tests/server/trade_fixture.rs"
required-features = ["test-fixtures"]

[[example]]
name = "session_fixture"
path = "../../tests/server/session_fixture.rs"
required-features = ["test-fixtures"]

[[example]]
name = "snapshot_fixture"
path = "../../tests/server/snapshot_fixture.rs"
required-features = ["test-fixtures"]

[[example]]
name = "muzzle_flashes_fixture"
path = "../../tests/server/muzzle_flashes_fixture.rs"
required-features = ["test-fixtures"]

[dependencies]
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
base64 = "0.23"
ciborium = "0.2"
flate2 = "1"
hashbrown = { version = "0.17", default-features = false, features = [
  "default-hasher",
  "inline-more",
] }
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
percent-encoding = "2"
rpprof = { version = "0.18.5", default-features = false, features = [
  "framehop-unwinder",
  "prost-codec",
] }
rusqlite = { version = "0.43", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
smallvec = "1"
str0m = { version = "0.25.0", default-features = false, features = [
  "aws-lc-rs",
] }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "flight_mode_fixture"
path = "../../tests/server/flight_mode_fixture.rs"
required-features = ["test-fixtures"]

[[example]]
name = "npc_ships_fixture"
path = "../../tests/server/npc_ships_fixture.rs"
required-features = ["test-fixtures"]

[[example]]
name = "ship_destruction_fixture"
path = "../../tests/server/ship_destruction_fixture.rs"
required-features = ["test-fixtures"]

[[example]]
name = "beam_visibility_fixture"
path = "../../tests/server/beam_visibility_fixture.rs"
required-features = ["test-fixtures"]

[[example]]
name = "gate_collisions_fixture"
path = "../../tests/server/gate_collisions_fixture.rs"
required-features = ["test-fixtures"]

[[example]]
name = "projectile_prediction"
path = "../../tests/server/projectile_prediction.rs"
required-features = ["test-fixtures"]

[[example]]
name = "http_replay"
path = "../../tests/server/http_replay.rs"
