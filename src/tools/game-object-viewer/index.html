<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameObject Viewer · Unicorn Mining Co.</title>
  </head>
  <body>
    <aside>
      <header>
        <p>UNICORN MINING CO.</p>
        <h1>GameObject Viewer</h1>
      </header>
      <label for="object-type">Object type</label>
      <select id="object-type">
        <option value="ship">Ship</option>
        <option value="station">Station</option>
        <option value="item">Item</option>
        <option value="asteroid">Asteroid</option>
      </select>
      <label for="spec">Spec</label>
      <select id="spec"></select>
      <fieldset>
        <legend>View</legend>
        <label><input id="grid" type="checkbox" /> Coordinate grid</label>
        <label
          ><input id="mount-points" type="checkbox" /> Mounting points</label
        >
        <label><input id="spin" type="checkbox" /> Spin</label>
        <button id="reset-rotation" type="button">Reset rotation</button>
        <label for="zoom">Zoom <output id="zoom-value"></output></label>
        <input id="zoom" type="range" min="1" max="8" step="0.25" />
      </fieldset>
      <fieldset id="module-controls">
        <legend>Fitted modules</legend>
        <div id="modules"></div>
      </fieldset>
      <fieldset>
        <legend>Effects</legend>
        <button id="replay-effect" type="button">
          Replay plasma explosion
        </button>
        <button id="replay-autogun-effect" type="button">
          Replay autogun explosion
        </button>
        <label
          ><input id="slow-effect" type="checkbox" /> Slow motion (¼
          speed)</label
        >
      </fieldset>
      <p id="source"></p>
    </aside>
    <main>
      <canvas id="canvas" aria-label="GameObject preview"></canvas>
      <output id="coordinates" hidden></output>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
