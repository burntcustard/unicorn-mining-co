<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module Viewer · Unicorn Mining Co.</title>
  </head>
  <body>
    <div class="viewer-controls" role="complementary">
      <header>
        <p class="text-muted text-xs">UNICORN MINING CO.</p>
        <h1 class="text-lg my-4">Module Viewer</h1>
      </header>
      <nav
        class="module-viewer-tabs"
        role="tablist"
        aria-label="Module viewer"
        aria-orientation="vertical"
      >
        <button
          id="modules-tab"
          role="tab"
          aria-selected="true"
          aria-controls="modules-panel"
          type="button"
        >
          Modules
        </button>
        <button
          id="comparison-tab"
          role="tab"
          aria-selected="false"
          aria-controls="comparison-panel"
          tabindex="-1"
          type="button"
        >
          Thruster comparison
        </button>
        <button
          id="power-plant-comparison-tab"
          role="tab"
          aria-selected="false"
          aria-controls="power-plant-comparison-panel"
          tabindex="-1"
          type="button"
        >
          Power plant comparison
        </button>
      </nav>
      <div id="module-controls">
        <label class="mt-4 mb-2" for="category">Category</label>
        <select class="text-xs" id="category"></select>
        <label class="mt-4 mb-2" for="folder">Subfolder</label>
        <select class="text-xs" id="folder"></select>
        <fieldset class="my-4">
          <legend>View</legend>
          <label class="mt-4 mb-2">
            <input id="models" type="checkbox" />
            Preview models
          </label>
        </fieldset>
      </div>
    </div>
    <main class="module-viewer-main ui-surface">
      <section id="modules-panel" role="tabpanel" aria-labelledby="modules-tab">
        <div id="modules" class="module-viewer-grid"></div>
      </section>
      <section
        id="comparison-panel"
        role="tabpanel"
        aria-labelledby="comparison-tab"
        hidden
      >
        <div id="thruster-comparison"></div>
      </section>
      <section
        id="power-plant-comparison-panel"
        role="tabpanel"
        aria-labelledby="power-plant-comparison-tab"
        hidden
      >
        <div id="power-plant-comparison"></div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
