<section
  class="ui-layout ui-surface h-full ui-settings gap-6"
  aria-labelledby="settings-heading"
>
  <header class="ui-row gap-6 flex-wrap">
    <h2 class="uppercase text-xl" id="settings-heading">Settings</h2>
    <button class="uppercase button" data-back>Back</button>
  </header>
  <nav class="ui-tabs gap-6 uppercase">
    <button class="ui-tab ui-highlight" aria-current="page" data-controls>
      Controls</button
    ><button class="ui-tab ui-highlight" data-graphics>Graphics</button>
  </nav>
  <section class="ui-scroll grid gap-4 ui-control-panel">
    <p>
      Select a binding and press a key. Escape cancels. Tab, Enter and Escape
      remain available for menus.
    </p>
    <div data-bindings></div>
    <button class="uppercase button" data-reset>Reset to defaults</button>
  </section>
  <section class="ui-scroll" data-graphics-panel hidden>
    <label class="uppercase ui-row gap-6 py-2"
      >Starfield <input type="checkbox" data-graphic="0"
    /></label>
    <label class="uppercase ui-row gap-6 py-2"
      >Clouds <input type="checkbox" data-graphic="1"
    /></label>
    <label class="uppercase ui-row gap-6 py-2"
      >Sparkles <input type="checkbox" data-graphic="2"
    /></label>
    <label class="uppercase ui-row gap-6 py-2"
      >Rendering resolution
      <select class="ui-input" data-resolution>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select></label
    >
    <p>Changes apply immediately. Lower resolution reduces rendering work.</p>
  </section>
  <p class="ui-status" role="status"></p>
  <dialog
    class="ui-card"
    data-binding-dialog
    aria-labelledby="binding-heading"
    aria-describedby="binding-prompt"
  >
    <h3 class="uppercase text-lg" id="binding-heading">Change key</h3>
    <p class="mt-4" id="binding-prompt"></p>
    <p class="ui-status mt-4" role="status"></p>
    <form method="dialog" class="ui-actions gap-2 mt-4">
      <button class="uppercase button">Cancel</button>
    </form>
  </dialog>
</section>
