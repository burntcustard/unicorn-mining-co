<section class="game-chat" aria-label="Communications" hidden>
  <div class="chat-tabs" role="tablist">
    <button type="button" role="tab" aria-selected="true">Sector</button>
    <button type="button" role="tab" aria-selected="false">Global</button>
  </div>
  <div class="chat-log" role="log" aria-live="polite"></div>
  <div class="chat-contact" hidden>
    <p></p>
    <button type="button">Yes — request access</button>
  </div>
  <input
    placeholder="Press Enter to chat"
    aria-label="Chat message"
    maxlength="240"
  />
</section>
