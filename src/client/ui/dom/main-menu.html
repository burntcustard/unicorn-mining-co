<main class="ui-main h-full gap-6 grid px-10 pb-8">
  <h1 class="uppercase ui-logo text-xl">
    Unicorn-
    <br />
    Mining.co
  </h1>
  <div class="ui-pilot ui-heading-pair grid text-right" hidden>
    <small class="uppercase text-sm">Pilot</small>
    <div class="text-lg">
      <span class="ui-label mr-2" aria-hidden="true">◆</span>
      <span class="ui-label" data-pilot></span>
    </div>
  </div>
  <nav class="ui-menu grid gap-2 leading-tight uppercase">
    <button class="ui-choice text-xl" data-action="play">
      <span>Play</span>
    </button>
    <button class="ui-choice text-xl" data-action="saves">
      <span>Saves</span>
    </button>
    <button class="ui-choice text-xl" data-action="settings">
      <span>Settings</span>
    </button>
    <button class="ui-choice text-xl" data-action="credits">
      <span>Credits</span>
    </button>
    <button class="ui-choice text-xl" data-action="disconnect" hidden>
      <span>Disconnect</span>
    </button>
  </nav>
  <canvas class="ui-preview" aria-hidden="true" hidden></canvas>
  <footer class="ui-footer flex items-center gap-8 text-sm">
    <span class="ui-version"></span>
    <div class="ui-controls gap-8 uppercase flex">
      <span class="gap-3 flex items-center">
        <span class="gap-1 flex items-center">
          <kbd class="flex-none">↑</kbd>
          <kbd class="flex-none">↓</kbd>
        </span>
        Navigate
      </span>
      <span class="gap-3 flex items-center">
        <kbd class="flex-none">Enter</kbd>
        Select
      </span>
      <span class="gap-3 flex items-center" data-resume-hint hidden>
        <kbd class="flex-none">Esc</kbd>
        Resume
      </span>
    </div>
  </footer>
</main>
