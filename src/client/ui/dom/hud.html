<div class="hud-left hud-widget grid gap-3" hidden>
  <section
    class="hud-modules ui-controls grid gap-2 uppercase text-outline outline-shadow"
  ></section>
  <div class="hud-stores grid">
    <div class="hud-stores-panel ui-card" aria-hidden="true"></div>
    <section class="hud-cargo grid" data-store="cargo">
      <output class="ui-inline items-baseline gap-1 text-xs text-outline">
        <span class="text-lg" data-cargo-current></span>
        <span class="ui-inline text-secondary">
          /&#8201;
          <span data-cargo-capacity></span>
        </span>
      </output>
      <button
        class="ui-tooltip hud-store-label text-xs uppercase"
        type="button"
        aria-label="Cargo"
        aria-describedby="hud-cargo-tooltip"
      >
        Cargo
        <span
          class="ui-tooltip-content ui-card text-xs"
          id="hud-cargo-tooltip"
          role="tooltip"
        ></span>
      </button>
    </section>
    <section class="hud-fuel grid" data-store="fuel">
      <span class="text-xs" aria-hidden="true">E</span>
      <div
        class="hud-fuel-track ui-power-track ui-power-track-xs"
        role="meter"
        aria-label="Fuel"
        aria-valuemin="0"
      >
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <span class="text-xs" aria-hidden="true">F</span>
      <button
        class="ui-tooltip hud-store-label text-xs uppercase"
        type="button"
        aria-label="Fuel"
        aria-describedby="hud-fuel-tooltip"
      >
        Fuel
        <span
          class="ui-tooltip-content ui-card text-xs"
          id="hud-fuel-tooltip"
          role="tooltip"
        ></span>
      </button>
    </section>
    <section class="grid" data-store="power">
      <button
        class="ui-tooltip hud-store-label text-xs gap-1"
        type="button"
        aria-label="Power"
        aria-describedby="hud-power-tooltip"
      >
        <span class="text-color" aria-hidden="true">🗲</span>
        <output data-power-label></output>
        <span
          class="ui-tooltip-content ui-card text-xs"
          id="hud-power-tooltip"
          role="tooltip"
        ></span>
      </button>
      <div class="grid gap-1">
        <div
          class="ui-power-track ui-power-track-sm"
          data-power-storage
          role="meter"
          aria-label="Stored power"
          aria-valuemin="0"
        >
          <span class="ui-power-part"></span>
        </div>
        <div
          class="ui-power-track ui-power-track-xxs ui-power-marked"
          data-power-usage-bar
          role="meter"
          aria-label="Power consumption"
          aria-valuemin="0"
        ></div>
      </div>
      <output class="grid text-xs text-outline leading-tight text-right">
        <span class="text-color" data-power-generation></span>
        <span class="text-color" data-power-usage></span>
      </output>
      <output class="ui-inline items-baseline gap-1 text-outline text-color">
        <span class="text-lg" data-power-net></span>
        <span class="text-xs">MW</span>
      </output>
    </section>
  </div>
</div>
<section class="hud-sector hud-widget ui-card ui-inline gap-4" hidden>
  <span class="text-muted">Sector</span>
  <strong class="text-color" data-sector></strong>
  <output data-coordinates></output>
</section>
<div class="hud-right hud-widget grid gap-3" hidden>
  <output
    class="hud-credits ui-card text-right text-lg"
    aria-label="Unicredits"
  ></output>
  <aside class="hud-target ui-card" hidden>
    <div class="ui-row text-muted gap-3">
      <span>Target</span>
      <output data-distance></output>
    </div>
    <div class="ui-inline gap-3 mt-4">
      <div class="hud-target-icon ui-icon" aria-hidden="true"></div>
      <div>
        <h2 data-name></h2>
        <span class="text-sm text-muted" data-kind></span>
      </div>
    </div>
    <p class="mt-4" data-description></p>
    <div class="ui-row gap-3 mt-4" data-value-row>
      <span class="text-muted text-sm">Est. value</span>
      <output data-value></output>
    </div>
  </aside>
</div>
<section class="hud-map hud-widget ui-card border-full" hidden>
  <canvas
    width="300"
    height="300"
    role="img"
    aria-label="Nearby objects, north up"
  ></canvas>
</section>
