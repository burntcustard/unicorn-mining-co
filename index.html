<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unicorn Mining Co</title>
    <link
      rel="preload"
      href="/font/gemetric.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body style="margin: 0; background: #102">
    <canvas
      id="canvas"
      style="
        display: block;
        width: 100%;
        height: 100vh;
        background: #102;
        opacity: 0;
        transition: opacity 2s;
      "
    ></canvas>
    <div
      id="connection-status"
      role="status"
      aria-live="polite"
      style="
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: white;
        background: #213;
        padding: 14px;
        font-size: 16px;
        text-align: center;
        z-index: 10;
      "
    >
      CONNECTING TO GAME...
    </div>
    <script
      type="module"
      src="src/client/background/background-boot.ts"
    ></script>
    <script type="module" src="src/client/main.ts"></script>
  </body>
</html>
